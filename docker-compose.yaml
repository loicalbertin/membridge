services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: membridge-qdrant
    ports:
      - "${QDRANT_BIND_ADDR:-127.0.0.1}:6333:6333"
      - "${QDRANT_BIND_ADDR:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage:z
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  indexer:
    build:
      dockerfile: Dockerfile
      target: indexer
    container_name: membridge-indexer
    volumes:
      - ${VAULT_OBSIDIAN_PATH}:/vault:ro
    environment:
      - MB_IDX_VAULT_PATH=/vault
      - MB_IDX_EMBEDDING_API_KEY=${MB_IDX_EMBEDDING_API_KEY}
      - MB_IDX_EMBEDDING_BASE_URL=${MB_IDX_EMBEDDING_BASE_URL}
      - MB_IDX_EMBEDDING_MODEL=${MB_IDX_EMBEDDING_MODEL}
      - MB_IDX_QDRANT_BASE_URL=http://qdrant:6334
      - MB_IDX_LOG_LEVEL=debug
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      dockerfile: Dockerfile
      target: mcp
    container_name: membridge-mcp
    ports:
      - "${MCP_BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      # "http" is the Streamable HTTP transport (endpoint /mcp).
      # Use "http-sse" to pin the legacy SSE transport instead.
      # Note: with "http", the legacy SSE endpoint /sse is still served for rollback.
      - MB_MCP_TRANSPORT=http
      - MB_MCP_QDRANT_BASE_URL=http://qdrant:6334
      - MB_MCP_QDRANT_COLLECTION=memory
      - MB_MCP_EMBEDDING_BASE_URL=${MB_MCP_EMBEDDING_BASE_URL}
      - MB_MCP_EMBEDDING_API_KEY=${MB_MCP_EMBEDDING_API_KEY}
      - MB_MCP_EMBEDDING_MODEL=${MB_MCP_EMBEDDING_MODEL}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data: